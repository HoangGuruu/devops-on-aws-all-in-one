---
# upgrade-cluster.yml
# Upgrade Kubernetes kubeadm cluster by one minor version
# Inventory groups expected:
#   [master]
#   master-node
#
#   [workers]
#   worker-node-1
#   worker-node-2

- name: Prepare Kubernetes upgrade variables on all nodes
  hosts: all
  become: yes
  gather_facts: yes
  tasks:
    - name: Get current Kubernetes version from kubelet
      shell: "kubelet --version | awk '{print $2}' | sed 's/v//'"
      register: current_k8s_version
      changed_when: false

    - name: Calculate current and target minor version
      set_fact:
        current_minor_version: "{{ current_k8s_version.stdout.split('.')[0] }}.{{ current_k8s_version.stdout.split('.')[1] }}"
        target_minor_version: "{{ current_k8s_version.stdout.split('.')[0] }}.{{ (current_k8s_version.stdout.split('.')[1] | int) + 1 }}"

    - name: Display upgrade plan
      debug:
        msg: |
          Kubernetes upgrade plan:
          Host: {{ inventory_hostname }}
          Current version: {{ current_k8s_version.stdout }}
          Current minor: v{{ current_minor_version }}
          Target minor: v{{ target_minor_version }}

    - name: Update Kubernetes apt repository to target minor version
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ target_minor_version }}/deb/ /
        owner: root
        group: root
        mode: "0644"

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Find latest patch version for target Kubernetes version
      shell: "apt-cache madison kubeadm | grep '{{ target_minor_version }}' | head -1 | awk '{print $3}'"
      register: k8s_latest_patch_version
      changed_when: false

    - name: Fail if target Kubernetes package version is not found
      fail:
        msg: "Cannot find kubeadm package for v{{ target_minor_version }}. Check Kubernetes apt repository."
      when: k8s_latest_patch_version.stdout == ""

    - name: Display target package version
      debug:
        msg: "Target Kubernetes package version: {{ k8s_latest_patch_version.stdout }}"


- name: Upgrade Kubernetes control-plane node
  hosts: master
  become: yes
  serial: 1
  vars:
    kube_user: ubuntu
    kubeconfig_path: /home/ubuntu/.kube/config
  tasks:
    - name: Set Kubernetes node name
      set_fact:
        kube_node_name: "{{ ansible_hostname }}"

    - name: Cordon control-plane node
      command: "kubectl cordon {{ kube_node_name }}"
      become_user: "{{ kube_user }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: Drain control-plane node
      command: "kubectl drain {{ kube_node_name }} --ignore-daemonsets --delete-emptydir-data --force"
      become_user: "{{ kube_user }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: Unhold kubeadm
      command: apt-mark unhold kubeadm
      changed_when: false

    - name: Upgrade kubeadm
      apt:
        name: "kubeadm={{ k8s_latest_patch_version.stdout }}"
        state: present
        update_cache: yes

    - name: Hold kubeadm
      command: apt-mark hold kubeadm
      changed_when: false

    - name: Show kubeadm version
      command: kubeadm version
      register: kubeadm_version_output
      changed_when: false

    - name: Display kubeadm version
      debug:
        msg: "{{ kubeadm_version_output.stdout }}"

    - name: Run kubeadm upgrade plan
      command: kubeadm upgrade plan
      register: upgrade_plan_output
      changed_when: false

    - name: Display kubeadm upgrade plan
      debug:
        msg: "{{ upgrade_plan_output.stdout }}"

    - name: Extract Kubernetes version for kubeadm upgrade
      set_fact:
        k8s_version_number: "{{ k8s_latest_patch_version.stdout.split('-')[0] }}"

    - name: Apply kubeadm upgrade
      command: "kubeadm upgrade apply v{{ k8s_version_number }} --yes"
      changed_when: true

    - name: Unhold kubelet and kubectl
      command: apt-mark unhold kubelet kubectl
      changed_when: false

    - name: Upgrade kubelet and kubectl
      apt:
        name:
          - "kubelet={{ k8s_latest_patch_version.stdout }}"
          - "kubectl={{ k8s_latest_patch_version.stdout }}"
        state: present
        update_cache: yes

    - name: Hold kubelet and kubectl
      command: apt-mark hold kubelet kubectl
      changed_when: false

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart kubelet
      systemd:
        name: kubelet
        state: restarted
        enabled: yes

    - name: Uncordon control-plane node
      command: "kubectl uncordon {{ kube_node_name }}"
      become_user: "{{ kube_user }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true


- name: Upgrade Kubernetes worker nodes
  hosts: workers
  become: yes
  serial: 1
  vars:
    kube_user: ubuntu
    kubeconfig_path: /home/ubuntu/.kube/config
    master_delegate: "{{ groups['master'][0] }}"
  tasks:
    - name: Set Kubernetes node name
      set_fact:
        kube_node_name: "{{ ansible_hostname }}"

    - name: Unhold kubeadm
      command: apt-mark unhold kubeadm
      changed_when: false

    - name: Upgrade kubeadm
      apt:
        name: "kubeadm={{ k8s_latest_patch_version.stdout }}"
        state: present
        update_cache: yes

    - name: Hold kubeadm
      command: apt-mark hold kubeadm
      changed_when: false

    - name: Run kubeadm upgrade node
      command: kubeadm upgrade node
      changed_when: true

    - name: Cordon worker node
      command: "kubectl cordon {{ kube_node_name }}"
      delegate_to: "{{ master_delegate }}"
      become: yes
      become_user: "{{ kube_user }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: Drain worker node
      command: "kubectl drain {{ kube_node_name }} --ignore-daemonsets --delete-emptydir-data --force"
      delegate_to: "{{ master_delegate }}"
      become: yes
      become_user: "{{ kube_user }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: Unhold kubelet and kubectl
      command: apt-mark unhold kubelet kubectl
      changed_when: false

    - name: Upgrade kubelet and kubectl
      apt:
        name:
          - "kubelet={{ k8s_latest_patch_version.stdout }}"
          - "kubectl={{ k8s_latest_patch_version.stdout }}"
        state: present
        update_cache: yes

    - name: Hold kubelet and kubectl
      command: apt-mark hold kubelet kubectl
      changed_when: false

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart kubelet
      systemd:
        name: kubelet
        state: restarted
        enabled: yes

    - name: Uncordon worker node
      command: "kubectl uncordon {{ kube_node_name }}"
      delegate_to: "{{ master_delegate }}"
      become: yes
      become_user: "{{ kube_user }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true